[plugins."ponytail@ponytail"]
enabled = true

[mcp_servers.playwright]
command = "npx"
args = ["--yes", "@playwright/mcp@0.0.83", "--browser", "chrome", "--caps", "vision", "--isolated", "--output-dir", "target/playwright-mcp"]
startup_timeout_sec = 60

[mcp_servers.rust_analyzer]
command = "rust-analyzer-mcp"
startup_timeout_sec = 60
