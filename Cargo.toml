[package]
name = "reng"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Rust game engine for macOS, Windows, and the web"
repository = "https://github.com/BurningBlueFox/reng"
license-file = "LICENSE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-chrome = "0.7.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web = "0.1.3"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
serde_json = "1.0"
