[package]
name = "reng"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Rust game engine for macOS, Windows, and the web"
repository = "https://github.com/BurningBlueFox/reng"
license-file = "LICENSE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "wgsl", "webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-chrome = "0.7.2"
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web = "0.1.3"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "CustomEvent", "CustomEventInit"] }

[dev-dependencies]
serde_json = "1.0"
